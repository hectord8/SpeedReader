<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpeedReader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">RSVP READER</p>
        <h1>SpeedReader</h1>
      </div>
      <button id="themeButton" class="icon-button" type="button" aria-label="Toggle dark mode">☼</button>
    </header>

    <section class="reader" aria-live="polite">
      <span id="word" class="word">Select text to begin</span>
    </section>

    <div class="progress-row">
      <span id="progressLabel">0 / 0</span>
      <span id="statusLabel">Ready</span>
    </div>
    <progress id="progress" value="0" max="1" aria-label="Reading progress"></progress>

    <div class="controls">
      <button id="previousButton" class="secondary" type="button" aria-label="Previous word">‹</button>
      <button id="playButton" class="play" type="button">Play</button>
      <button id="nextButton" class="secondary" type="button" aria-label="Next word">›</button>
    </div>

    <section class="speed-control">
      <div class="setting-label"><label for="speed">Speed</label><output id="speedValue" for="speed">300 WPM</output></div>
      <input id="speed" type="range" min="100" max="1000" step="25" value="300">
      <div class="range-labels"><span>100</span><span>1000 WPM</span></div>
    </section>

    <section class="text-input">
      <label for="text">Or paste text</label>
      <textarea id="text" rows="3" placeholder="Paste an article or paragraph here..."></textarea>
      <button id="loadButton" class="load" type="button">Load text</button>
    </section>

    <p class="hint">Select text on a webpage, then open SpeedReader. <kbd>Space</kbd> play/pause · <kbd>↑</kbd><kbd>↓</kbd> speed</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
